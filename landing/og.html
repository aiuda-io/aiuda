<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>aiuda · vista previa</title>
<!--
  La imagen de vista previa del sitio (1200x630): lo que se ve cuando alguien
  comparte aiuda.io por WhatsApp, LinkedIn o X. Usa el mismo sistema visual de la
  consola y de la landing (web/DESIGN.md): papel, tinta y un solo azul, con la letra
  del sistema. Conviene exportarla en una Mac, que es donde esa letra es SF Pro.

  Para volver a exportarla:  uv run python scripts/og.py og
-->
<style>
:root{
  --bg: oklch(0.995 0.001 250);
  --line: oklch(0.918 0.003 250);
  --ink: oklch(0.2 0.006 255);
  --ink-2: oklch(0.39 0.006 255);
  --ink-3: oklch(0.515 0.006 255);
  --accent: oklch(0.44 0.105 238);
  --brand: oklch(0.62 0.105 228);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --marca: "Avenir Next", "Avenir", -apple-system, system-ui, "Segoe UI", sans-serif;
}
*{ box-sizing: border-box; margin: 0; padding: 0; }
body{
  width: 1200px; height: 630px; overflow: hidden;
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 64px 80px 56px;
}
.wordmark{
  font-family: var(--marca); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;
  display: inline-flex; align-items: baseline; gap: 9px;
}
.wordmark i{ width: 11px; height: 11px; border-radius: 999px; background: var(--brand); }
h1{ font-size: 92px; line-height: 1; letter-spacing: -0.044em; font-weight: 650; max-width: 12ch; text-wrap: balance; }
p{ margin-top: 28px; font-size: 28px; line-height: 1.4; letter-spacing: -0.014em; color: var(--ink-2); max-width: 34em; }
.pie{
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--line); padding-top: 22px;
  font-size: 21px; color: var(--ink-3);
}
.pie b{ display: inline-flex; align-items: center; gap: 12px; font-weight: 500; color: var(--ink-2); }
.pie b::before{ content: ""; width: 9px; height: 9px; border-radius: 999px; background: var(--accent); }
</style>
</head>
<body>
  <div class="wordmark">aiuda<i></i></div>

  <div>
    <h1>La cobranza del día, lista para que la apruebes.</h1>
    <p>Lee tu cartera, redacta cada recordatorio y espera. Tú apruebas.</p>
  </div>

  <div class="pie">
    <b>App para Mac, de código abierto</b>
    <span>Un proyecto de Hanova Consulting</span>
  </div>
</body>
</html>
