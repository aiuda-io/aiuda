<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<!--
  La imagen de vista previa del sitio (1200x630): lo que se ve cuando alguien
  comparte aiuda.io por WhatsApp, LinkedIn o X. Se arma con la misma paleta y la
  misma tipografía de la landing, así que cambiar la marca aquí no la desalinea.

  Para volver a exportarla:  uv run python scripts/og.py
-->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --paper: oklch(0.99 0.004 245);
  --ink: oklch(0.26 0.045 250);
  --ink-muted: oklch(0.47 0.03 250);
  --brand: oklch(0.52 0.115 238);
  --brand-soft: oklch(0.955 0.026 238);
  --line: oklch(0.915 0.008 250);
  --display: "Satoshi", "Inter", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0 }
body{
  width:1200px; height:630px; overflow:hidden;
  background:var(--paper); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:72px 80px;
}
/* Retícula tenue: da textura sin decorar. */
body::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--line) 1px, transparent 1px);
  background-size:100% 42px; opacity:.5;
  mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
}
.marca{ display:flex; align-items:center; gap:10px; position:relative }
.marca b{ font-family:var(--display); font-weight:900; font-size:34px; letter-spacing:-.02em }
.punto{ width:11px; height:11px; border-radius:50%; background:var(--brand); margin-top:6px }
h1{
  font-family:var(--display); font-weight:900; font-size:82px; line-height:1.02;
  letter-spacing:-.035em; position:relative; max-width:16ch;
}
h1 em{ font-style:normal; color:var(--brand) }
p{ font-size:26px; line-height:1.45; color:var(--ink-muted); max-width:42ch; margin-top:26px; position:relative }
.pie{ display:flex; align-items:center; justify-content:space-between; position:relative }
.sellos{ display:flex; gap:12px }
.sello{
  font-size:17px; font-weight:500; padding:9px 16px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-muted); background:#fff;
}
.sello.acento{ background:var(--brand-soft); border-color:transparent; color:var(--brand) }
.casa{ font-size:17px; color:var(--ink-muted) }
</style>
</head>
<body>
  <div class="marca"><b>aiuda</b><span class="punto"></span></div>

  <div>
    <h1>Ayudantes de IA en <em>tu computadora</em>.</h1>
    <p>Leen tu Odoo, tus CFDI y tu Excel, redactan la cobranza y te la dejan lista. Tú apruebas antes de que salga.</p>
  </div>

  <div class="pie">
    <div class="sellos">
      <span class="sello acento">Corre en tu computadora</span>
      <span class="sello">Open source · Apache-2.0</span>
      <span class="sello">Sin cuentas ni telemetría</span>
    </div>
    <div class="casa">Un proyecto de Hanova Consulting</div>
  </div>
</body>
</html>
