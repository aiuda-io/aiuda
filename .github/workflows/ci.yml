name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (export estatico, el que viaja en el wheel)
        run: npm run export

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build consola
        run: cd web && npm ci && npm run export
      - name: Empaquetar consola dentro del server
        run: |
          rm -rf server/aiuda_server/static
          cp -R web/out server/aiuda_server/static
      - name: Build wheels (core + server con consola embebida)
        run: |
          uv build --package aiuda-core --wheel -o dist
          uv build --package aiuda-server --wheel -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl
