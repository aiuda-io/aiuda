[project]
name = "aiuda-workspace"
version = "0.1.0"
description = "aiuda — asistentes de IA para PyMEs mexicanas (workspace raíz)"
requires-python = ">=3.11"
dependencies = ["aiuda-core", "aiuda-server"]

[project.optional-dependencies]
# CUA (Oficina administrativa): navegador Chromium local (Playwright) que opera el
# agente. `uv sync --extra cua` desde la raíz instala el extra del core; después:
# `.venv/bin/playwright install chromium` (una vez). Ver docs/CUA.md.
cua = ["aiuda-core[cua]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "server"]

[tool.uv.sources]
aiuda-core = { workspace = true }
aiuda-server = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "server/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
